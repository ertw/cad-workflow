[project]
name = "cad-tooling"
version = "0.1.0"
description = "Shared immutable CAD builds and loopback project preview"
requires-python = ">=3.12,<3.13"
dependencies = [
  "build123d==0.13.0",
  "cadquery-ocp-novtk==8.0.1.1.0",
  "ocp-viewer==1.1.3",
  "ocp-viewer-core==1.0.13",
  "trimesh==4.12.2",
  "numpy==2.5.3",
  "websockets==17.2",
]

[dependency-groups]
dev = ["pytest==9.0.2", "playwright==1.58.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
